name: Build APK Pruebas - Dame la cola

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalación Forzada de Diseño
        run: |
          sed -i 's/catalog:/latest/g' package.json
          sed -i '/@workspace/d' package.json
          rm -f .npmrc package-lock.json
          
          npm install --force --legacy-peer-deps
          npm install -D tailwindcss @tailwindcss/vite postcss autoprefixer vite @vitejs/plugin-react typescript ts-node --legacy-peer-deps
          
          npm install firebase lucide-react clsx tailwind-merge class-variance-authority @radix-ui/react-slot react-leaflet leaflet @capacitor/geolocation --legacy-peer-deps
          
          echo '<!DOCTYPE html>
          <html lang="es">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
              <title>Dame la cola</title>
              <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/src/main.tsx"></script>
            </body>
          </html>' > index.html

          npx vite build --outDir dist
          
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Sincronización Capacitor e Íconos
        run: |
          # 1. Instalamos Capacitor y GPS
          npm install @capacitor/cli@latest @capacitor/core@latest @capacitor/android@latest @capacitor/push-notifications@latest @capacitor/geolocation@latest --legacy-peer-deps
          
          # 2. Creamos el archivo de configuración en formato JSON
          echo '{"appId": "com.damelacola.app", "appName": "Dame la cola", "webDir": "dist", "server": {"androidScheme": "https"}}' > capacitor.config.json
          rm -f capacitor.config.ts || true
          
          # 3. Agregamos la plataforma Android
          npx cap add android || true
          
          # 4. Copiamos el archivo de Firebase
          cp google-services.json android/app/ || true
          
          # 5. Inyectamos Firebase en los archivos Gradle
          sed -i '/dependencies {/a \        classpath "com.google.gms:google-services:4.4.1"' android/build.gradle
          echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
          
          # 6. Sincronizamos
          npx cap sync android
          # 🔥 INYECCIÓN DE VERSIÓN (SE DEBE HACER AQUÍ)
          sed -i 's/versionCode [0-9]*/versionCode 999/' android/app/build.gradle
          sed -i 's/versionName "[0-9.]*"/versionName "99"/' android/app/build.gradle

          # 7. INYECTAR TU LOGO (LA SOLUCIÓN)
          mkdir -p assets
          cp icon.png assets/icon.png || true
          npm install @capacitor/assets@latest --legacy-peer-deps
          npx capacitor-assets generate --android

          # 8. INYECTAR PERMISOS
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="true" />' android/app/src/main/AndroidManifest.xml
          
      - name: Generar APK de Prueba
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK para Instalar
        uses: actions/upload-artifact@v4
        with:
          name: DameLaCola-Test-APK
          path: android/app/build/outputs/apk/debug/*.apk
