name: Build APK - Forzar Renderizado Real

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reconstrucción Total de la App
        run: |
          # 1. Limpieza de Replit
          sed -i 's/catalog:/latest/g' package.json
          sed -i '/@workspace/d' package.json
          rm -f .npmrc package-lock.json
          rm -rf android
          
          # 2. Instalación de dependencias
          npm install --force
          npm install -D typescript ts-node vite @vitejs/plugin-react
          
          # 3. CREAR UN INDEX.HTML NUEVO (Para eliminar el mensaje falso)
          # Esto obliga a la app a cargar tu archivo App.tsx o main.tsx
          echo '<!DOCTYPE html>
          <html lang="es">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>RutaCom</title>
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/src/main.tsx"></script>
            </body>
          </html>' > index.html

          # 4. INTENTAR COMPILAR
          # Si main.tsx no existe, probaremos con App.tsx
          if [ ! -f "src/main.tsx" ]; then
            sed -i 's/main.tsx/App.tsx/g' index.html
          fi
          
          npx vite build --outDir dist

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Capacitor Sync
        run: |
          npm install @capacitor/cli@latest @capacitor/core@latest @capacitor/android@latest
          echo "import { CapacitorConfig } from '@capacitor/cli'; const config: CapacitorConfig = { appId: 'com.rutacom.app', appName: 'RutaCom', webDir: 'dist', server: { androidScheme: 'https' } }; export default config;" > capacitor.config.ts
          npx cap add android || true
          npx cap sync android

      - name: Generar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RutaCom-App-Real-FINAL
          path: android/app/build/outputs/apk/debug/*.apk
          
