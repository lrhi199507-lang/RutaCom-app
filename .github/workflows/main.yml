name: Build APK Final - RutaCom Real

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar y Compilar
        run: |
          # 1. Limpiar package.json de rastros de Replit
          sed -i 's/"catalog:[^"]*"/"latest"/g' package.json
          sed -i 's/"workspace:[^"]*"/"latest"/g' package.json
          
          # 2. Instalación limpia
          npm install --force
          
          # 3. COMPILAR LA APP (Aquí es donde se crea tu código real)
          npm run build
          
          # VERIFICACIÓN CRÍTICA: Si la carpeta dist no existe o está vacía, falla aquí.
          if [ ! -d "dist" ] || [ -z "$(ls -A dist)" ]; then
            echo "ERROR: La carpeta dist está vacía. Tu código no se compiló."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Integrar con Android
        run: |
          # Instalar capacitor CLI
          npm install @capacitor/cli @capacitor/core @capacitor/android
          
          # Sincronizar la carpeta 'dist' con el proyecto Android
          npx cap add android || true
          # Forzamos que Capacitor use la carpeta 'dist' que acabamos de crear
          sed -i 's/"webDir": "[^"]*"/"webDir": "dist"/' capacitor.config.json || echo '{"webDir": "dist"}' > capacitor.config.json
          
          npx cap sync android

      - name: Construir APK Nativo
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: RutaCom-App-Real
          path: android/app/build/outputs/apk/debug/*.apk
          
