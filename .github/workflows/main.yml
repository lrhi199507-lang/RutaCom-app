name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare Project
        run: |
          rm -rf android
          rm -f package-lock.json
          
          # 1. Instalación
          npm install --legacy-peer-deps --no-package-lock || true
          
          # 2. CREAR CARPETA WEB (Solución al error 160132.jpg)
          # Si usas React/Vite suele ser 'dist', si es plano es 'www' o 'public'
          # Creamos una carpeta 'www' vacía por si acaso para que Capacitor no falle
          mkdir -p www
          
          # 3. Reconstrucción
          npx cap add android
          npx cap sync android

      - name: Fix and Build
        run: |
          cd android
          # Reparamos SDK
          sed -i 's/compileSdkVersion.*/compileSdk = 34/' app/build.gradle || true
          sed -i 's/targetSdkVersion.*/targetSdk = 34/' app/build.gradle || true
          
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RutaCom-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          
