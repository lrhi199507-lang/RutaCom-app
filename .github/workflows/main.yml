name: Build APK - Forzar App Real
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preparación y Compilación Real
        run: |
          # 1. Limpiar rastro de Replit
          sed -i 's/catalog:/latest/g' package.json
          sed -i '/@workspace/d' package.json
          
          # 2. BORRAR EL INDEX FALSO Y ANDROID VIEJO
          # Esto evita que la APK salga con el mensaje de "está funcionando"
          rm -f index.html
          rm -rf android gradlew build.gradle
          
          # 3. Instalación de herramientas de compilación
          npm install --force
          npm install -D typescript ts-node vite @vitejs/plugin-react
          
          # 4. INTENTO DE BUILD REAL
          # Si esto falla, el log de GitHub nos dirá exactamente qué error hay en tu código src
          npx vite build --outDir dist
          
          # Verificación de seguridad: ¿Existe el index real?
          ls -R dist/index.html || exit 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Sincronización Capacitor
        run: |
          npm install @capacitor/cli@latest @capacitor/android@latest
          # Forzamos la configuración para que apunte a la carpeta 'dist'
          npx cap add android || true
          npx cap copy android
          npx cap sync android

      - name: Generar APK Final
        run: |
          cd android
          chmod +x gradlew
          # Ejecutamos con banderas de limpieza para quitar los NO-SOURCE
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RutaCom-App-Real
          path: android/app/build/outputs/apk/debug/*.apk
          
