name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          # Eliminamos el archivo que bloquea los permisos e instalamos en limpio
          rm -f package-lock.json
          npm install --legacy-peer-deps --no-package-lock || true
          npx cap sync android

      - name: Force Build
        run: |
          DIR=$(find . -name "build.gradle" -exec dirname {} \; | head -n 1)
          cd "$DIR"
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RutaCom-debug-apk
          path: "**/*.apk"
          
