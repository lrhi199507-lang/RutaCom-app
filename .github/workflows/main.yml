name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare Project
        run: |
          # 1. Limpieza inicial
          rm -rf android
          
          # 2. CIRUGÍA DE PACKAGE.JSON (Solución definitiva a 160212.jpg y 160213.jpg)
          # Este comando de node borra las dependencias que usan protocolos raros 
          # sin romper el formato del archivo JSON.
          node -e 'const fs = require("fs"); const pkg = JSON.parse(fs.readFileSync("package.json", "utf8")); const clean = (deps) => { if (!deps) return; for (const [k, v] of Object.entries(deps)) { if (v.includes("catalog:") || v.includes("workspace:")) delete deps[k]; } }; clean(pkg.dependencies); clean(pkg.devDependencies); fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));'
          
          # 3. Instalación forzada (omitirá lo que borramos)
          npm install --no-package-lock --force
          
          # 4. Crear carpeta de salida mínima para Capacitor
          mkdir -p dist
          echo "<html><body>RutaCom</body></html>" > dist/index.html
          cp -r * dist/ 2>/dev/null || true
          
          # 5. Generar Android
          npx cap add android
          npx cap sync android

      - name: Final Android Fix
        run: |
          mkdir -p android/app
          echo '{"project_info":{"project_number":"0","project_id":"temp"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"com.rutacom.app"}},"api_key":[{"current_key":"0"}]}]}' > android/app/google-services.json
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "android.namespace = 'com.rutacom.app'" >> android/gradle.properties
          echo "configurations.all { resolutionStrategy.force 'com.google.android.gms:play-services-basement:18.5.0' }" >> android/app/build.gradle
          sed -i 's/compileSdkVersion.*/compileSdkVersion 34/' android/app/build.gradle || true
          sed -i 's/compileSdk .*/compileSdk 34/' android/app/build.gradle || true
          sed -i 's/targetSdkVersion.*/targetSdkVersion 34/' android/app/build.gradle || true
          sed -i '/android {/a \    namespace "com.rutacom.app"' android/app/build.gradle || true
          
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RutaCom-debug-apk
          path: "**/*.apk"
          if-no-files-found: error
          
