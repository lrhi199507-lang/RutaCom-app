name: Build APK Final - App Real

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Limpiar y Preparar Entorno Real
        run: |
          # 1. Eliminar rastros de Replit que causan el error 404 (Captura 160862)
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const limpiar = (deps) => {
              if (!deps) return;
              Object.keys(deps).forEach(key => {
                if (key.includes("workspace") || String(deps[key]).includes("workspace") || String(deps[key]).includes("catalog")) {
                  delete deps[key];
                }
              });
            };
            limpiar(pkg.dependencies);
            limpiar(pkg.devDependencies);
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '

          # 2. Instalación forzada de dependencias
          npm install --force

          # 3. FIX CRÍTICO: Instalar el plugin que falta (Captura 160872) y Tailwind (Captura 160738)
          npm install @vitejs/plugin-react @tailwindcss/vite tailwindcss vite --save-dev

          # 4. Compilar tu código real (Si esto falla, veremos errores de tu código JS)
          npm run build

          # 5. Configurar Android
          npx cap add android || true
          sed -i '/android {/a \    namespace "com.rutacom.app"\n    compileOptions { sourceCompatibility JavaVersion.VERSION_21; targetCompatibility JavaVersion.VERSION_21 }\n    lintOptions { abortOnError false }' android/app/build.gradle
          npx cap sync android

      - name: Build APK (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Real
        uses: actions/upload-artifact@v4
        with:
          name: RutaCom-App-Real
          path: android/app/build/outputs/apk/debug/*.apk
          
