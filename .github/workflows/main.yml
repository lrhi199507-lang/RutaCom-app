name: Build APK Real - RutaCom v2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalación y Compilación Real
        run: |
          # 1. Limpieza de Replit
          sed -i 's/catalog:/latest/g' package.json
          sed -i '/@workspace/d' package.json
          rm -f .npmrc package-lock.json
          
          # 2. Borrar archivos de Android y el INDEX FALSO de la raíz
          # Esto obliga a Vite a usar su propio index.html
          rm -rf android gradlew gradlew.bat build.gradle settings.gradle
          
          # 3. Instalación de dependencias necesarias
          npm install --force
          npm install -D typescript ts-node vite @vitejs/plugin-react
          
          # 4. COMPILAR LA APP (Aquí es donde se crea tu interfaz real)
          # Si este comando falla, revisa los logs de GitHub para ver el error en src/
          npx vite build --outDir dist

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Sincronizar Capacitor con DIST
        run: |
          npm install @capacitor/cli@latest @capacitor/core@latest @capacitor/android@latest
          
          # Creamos el archivo de configuración manualmente para asegurar que apunte a 'dist'
          echo "import { CapacitorConfig } from '@capacitor/cli'; const config: CapacitorConfig = { appId: 'com.rutacom.app', appName: 'RutaCom', webDir: 'dist', server: { androidScheme: 'https' } }; export default config;" > capacitor.config.ts
          
          npx cap add android || true
          npx cap sync android

      - name: Generar APK Final
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -x test -x lint --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RutaCom-App-REAL
          path: android/app/build/outputs/apk/debug/*.apk
          
