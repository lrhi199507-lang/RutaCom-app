name: Build APK Final - RutaCom v3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Construcción de Interfaz Real
        run: |
          # 1. Limpieza de protocolos de Replit
          sed -i 's/catalog:/latest/g' package.json
          sed -i '/@workspace/d' package.json
          rm -f .npmrc package-lock.json
          
          # 2. Limpiar carpetas de Android viejas
          rm -rf android gradlew build.gradle
          
          # 3. Instalación de dependencias
          npm install --force
          npm install -D typescript ts-node vite @vitejs/plugin-react
          
          # 4. REPARAR RUTA DE INDEX (Solución al error UNRESOLVED_ENTRY)
          # Si el index está en la raíz, Vite debería verlo, pero vamos a forzarlo:
          npx vite build --base ./ --outDir dist
          
          # 5. Verificación física: ¿Se creó la carpeta dist?
          if [ ! -d "dist" ]; then
            echo "ERROR: Vite no generó la carpeta dist. Revisa tu vite.config.ts"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Sincronización Capacitor
        run: |
          npm install @capacitor/cli@latest @capacitor/core@latest @capacitor/android@latest
          
          # Aseguramos que Capacitor apunte a 'dist'
          echo "import { CapacitorConfig } from '@capacitor/cli'; const config: CapacitorConfig = { appId: 'com.rutacom.app', appName: 'RutaCom', webDir: 'dist', server: { androidScheme: 'https' } }; export default config;" > capacitor.config.ts
          
          npx cap add android || true
          npx cap copy android
          npx cap sync android

      - name: Generar APK de RutaCom
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RutaCom-App-Real-v3
          path: android/app/build/outputs/apk/debug/*.apk
          
