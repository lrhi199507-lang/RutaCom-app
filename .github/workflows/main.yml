name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps --no-package-lock || true
          npx cap sync android

      - name: Force Build
        run: |
          # 1. Buscamos la carpeta de Android
          ANDROID_DIR=$(find . -name "build.gradle" -not -path "*/node_modules/*" -exec dirname {} \; | head -n 1)
          
          # 2. Reparamos posibles errores de formato en los archivos gradle
          find . -name "*.gradle" -exec sed -i 's/\r$//' {} +
          
          # 3. Movemos los archivos de Capacitor a su sitio
          find . -name "capacitor.*.gradle" -exec cp {} "$ANDROID_DIR/" \;
          
          cd "$ANDROID_DIR"
          chmod +x gradlew
          
          # 4. Construimos ignorando errores menores de lint
          ./gradlew assembleDebug -x lint
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RutaCom-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
            **/*.apk
          if-no-files-found: error
          
