name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: List files and Build
        run: |
          echo "--- Listado de archivos para diagnóstico ---"
          find . -maxdepth 3 -not -path '*/.*'
          
          echo "--- Buscando gradlew ---"
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          
          if [ -z "$GRADLEW_PATH" ]; then
            echo "ERROR: No se encontró el archivo gradlew. ¿Subiste la carpeta completa?"
            exit 1
          fi
          
          echo "Encontrado en: $GRADLEW_PATH"
          chmod +x "$GRADLEW_PATH"
          cd $(dirname "$GRADLEW_PATH")
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RutaCom-debug-apk
          path: "**/*.apk"
          
