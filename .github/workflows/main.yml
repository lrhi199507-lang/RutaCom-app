name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run Build
        run: |
          # Buscar la carpeta que contiene el proyecto
          PROJECT_DIR=$(find . -name "gradlew" -exec dirname {} \;)
          cd $PROJECT_DIR
          # Forzar permisos de ejecución
          chmod +x gradlew
          # Ejecutar la construcción
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RutaCom-debug-apk
          path: "**/*.apk"
          
