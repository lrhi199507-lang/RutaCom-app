name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare Project and Fix JSON
        run: |
          rm -rf android
          rm -rf node_modules
          
          # REPARACIÓN JSON (No tocamos lo que ya funciona)
          node -e '
          const fs = require("fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const clean = (obj) => {
            if (!obj) return;
            for (const key in obj) {
              if (obj[key].includes("workspace:") || obj[key].includes("catalog:")) {
                delete obj[key];
              }
            }
          };
          clean(pkg.dependencies);
          clean(pkg.devDependencies);
          fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '
          
          npm install --no-package-lock --force --ignore-scripts
          mkdir -p dist
          echo "<html><body>RutaCom</body></html>" > dist/index.html
          
          # Añadir android de forma fresca
          npx cap add android
          
          # ARCHIVOS CRÍTICOS
          echo "{\"project_info\":{\"project_number\":\"123\",\"project_id\":\"rutacom-app\"},\"client\":[{\"client_info\":{\"mobilesdk_app_id\":\"1:0:android:0\",\"android_client_info\":{\"package_name\":\"com.rutacom.app\"}},\"api_key\":[{\"current_key\":\"0\"}]}]}" > android/app/google-services.json
          
          # CONFIGURACIÓN GRADLE (Aseguramos compatibilidad)
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> android/gradle.properties
          
          # PARCHE MAESTRO DE GRADLE (Evita el error de Namespace)
          # Borramos líneas que puedan chocar y ponemos el namespace arriba del todo
          sed -i 's/namespace .*//g' android/app/build.gradle
          sed -i "1i namespace 'com.rutacom.app'" android/app/build.gradle
          
          npx cap sync android

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          # Ejecutamos con --no-daemon y forzamos la compilación limpia
          ./gradlew assembleDebug --no-daemon --stacktrace --info
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RutaCom-App-Debug
          path: android/app/build/outputs/apk/debug/*.apk
          
