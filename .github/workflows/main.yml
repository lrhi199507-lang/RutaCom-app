name: Build APK - RutaCom Fix Colores

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalación Forzada de Diseño
        run: |
          # 1. Limpieza de archivos de configuración viejos
          sed -i 's/catalog:/latest/g' package.json
          sed -i '/@workspace/d' package.json
          rm -f .npmrc package-lock.json
          
          # 2. Instalación usando --legacy-peer-deps para evitar el error ERESOLVE
          npm install --force --legacy-peer-deps
          npm install -D tailwindcss @tailwindcss/vite postcss autoprefixer vite @vitejs/plugin-react typescript ts-node --legacy-peer-deps
          npm install firebase lucide-react clsx tailwind-merge class-variance-authority @radix-ui/react-slot react-leaflet leaflet --legacy-peer-deps

          # 3. Asegurar el index.html (Vital para que se vea algo)
          echo '<!DOCTYPE html>
          <html lang="es">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
              <title>Dame la cola</title>
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/src/main.tsx"></script>
            </body>
          </html>' > index.html

          # 4. COMPILAR
          npx vite build --outDir dist

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Sincronización Capacitor
        run: |
          # 1. Instalamos Capacitor, Notificaciones y Geolocation
          npm install @capacitor/cli@latest @capacitor/core@latest @capacitor/android@latest @capacitor/push-notifications@latest @capacitor/geolocation@latest --legacy-peer-deps
          
          # 2. Creamos el archivo de configuración
          echo "import { CapacitorConfig } from '@capacitor/cli'; const config: CapacitorConfig = { appId: 'com.rutacom.app', appName: 'Dame la cola', webDir: 'dist', server: { androidScheme: 'https' } }; export default config;" > capacitor.config.ts
          
          # 3. Agregamos la plataforma Android
          npx cap add android || true
          
          # 4. Copiamos el archivo de Firebase
          cp google-services.json android/app/
          
          # 5. Inyectamos Firebase en los archivos Gradle
          sed -i '/dependencies {/a \        classpath "com.google.gms:google-services:4.4.1"' android/build.gradle
          echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
          
          # 6. Sincronizamos (Esto crea la carpeta android si no existe y aplica cambios)
          npx cap sync android

          # 7. INYECTAR PERMISOS DE GPS (Directo al archivo generado)
          # Este comando inserta los permisos justo después de la etiqueta <manifest>
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" />' android/app/src/main/AndroidManifest.xml

          
      - name: Generar APK Final
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DameLaCola-App
          path: android/app/build/outputs/apk/debug/*.apk
