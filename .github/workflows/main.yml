name: Build APK Final - RutaCom Real

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Limpieza y Construcción
        run: |
          # 1. Eliminar protocolos de Replit (Solución a error 160862.jpg)
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const limpiar = (obj) => {
              if (!obj) return;
              for (const key in obj) {
                if (obj[key].includes("workspace") || obj[key].includes("catalog")) delete obj[key];
              }
            };
            limpiar(pkg.dependencies);
            limpiar(pkg.devDependencies);
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '

          # 2. Instalar dependencias necesarias
          npm install --force
          npm install @vitejs/plugin-react @tailwindcss/vite vite tailwindcss --save-dev

          # 3. COMPILAR TU CÓDIGO REAL
          npm run build

          # 4. Configurar Android (Sin el error de kotlinOptions de 160913.jpg)
          npx cap add android || true
          sed -i '/android {/a \    namespace "com.rutacom.app"\n    compileOptions { sourceCompatibility JavaVersion.VERSION_21; targetCompatibility JavaVersion.VERSION_21 }' android/app/build.gradle
          npx cap sync android

      - name: Generar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: RutaCom-App-Real
          path: android/app/build/outputs/apk/debug/*.apk
          
