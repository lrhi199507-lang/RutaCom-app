name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare Project
        run: |
          rm -rf android
          npm install --legacy-peer-deps --no-package-lock || true
          mkdir -p dist
          cp -r * dist/ 2>/dev/null || true
          npx cap add android
          npx cap sync android

      - name: Final Android Fix
        run: |
          # 1. Creamos el archivo de servicios vacío para que no dé error
          mkdir -p android/app
          echo '{"project_info":{"project_number":"0","project_id":"temp"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"com.rutacom.app"}},"api_key":[{"current_key":"0"}]}]}' > android/app/google-services.json
          
          # 2. Configuramos el Namespace y versiones
          echo "android.namespace = 'com.rutacom.app'" >> android/gradle.properties
          sed -i 's/compileSdkVersion.*/compileSdk = 34/' android/app/build.gradle || true
          sed -i 's/targetSdkVersion.*/targetSdk = 34/' android/app/build.gradle || true
          
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RutaCom-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          
