name: Build APK - RutaCom Diseño Activado

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalación de Motor de Estilos
        run: |
          # 1. Limpieza y preparación de paquetes
          sed -i 's/catalog:/latest/g' package.json
          sed -i '/@workspace/d' package.json
          rm -f .npmrc package-lock.json
          
          # 2. Instalación de TODAS las piezas que faltan
          # Instalamos ts-node para que pueda leer tu tailwind.config.ts
          npm install --force
          npm install -D tailwindcss postcss autoprefixer ts-node vite @vitejs/plugin-react typescript
          npm install lucide-react firebase clsx tailwind-merge class-variance-authority @radix-ui/react-slot
          
          # 3. Crear index.html limpio (Asegura que conecte con main.tsx)
          echo '<!DOCTYPE html>
          <html lang="es">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
              <title>RutaCom</title>
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/src/main.tsx"></script>
            </body>
          </html>' > index.html

          # 4. COMPILAR (Aquí es donde ocurre la magia del diseño)
          npx vite build --outDir dist

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Sincronización Capacitor
        run: |
          npm install @capacitor/cli@latest @capacitor/core@latest @capacitor/android@latest
          # Generar capacitor.config.ts apuntando a 'dist'
          echo "import { CapacitorConfig } from '@capacitor/cli'; const config: CapacitorConfig = { appId: 'com.rutacom.app', appName: 'RutaCom', webDir: 'dist', server: { androidScheme: 'https' } }; export default config;" > capacitor.config.ts
          npx cap add android || true
          npx cap copy android
          npx cap sync android

      - name: Generar APK con Colores Reales
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RutaCom-Pro-Diseno
          path: android/app/build/outputs/apk/debug/*.apk
          
