name: Build APK Final - RutaCom

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Versión requerida por Capacitor CLI

      - name: Limpieza y Construcción Web
        run: |
          # 1. Limpiar protocolos de Replit
          sed -i 's/catalog:/latest/g' package.json
          sed -i '/@workspace/d' package.json
          rm -f .npmrc package-lock.json
          
          # 2. BORRAR ARCHIVOS DE ANDROID EN RAÍZ (Para evitar conflictos)
          rm -rf android gradlew gradlew.bat build.gradle settings.gradle capacitor.build.gradle capacitor.settings.gradle
          
          # 3. Instalación y Build de tu código real
          npm install --force
          npm install vite @vitejs/plugin-react --save-dev
          npx vite build # Esto crea la carpeta 'dist' con tu interfaz real

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21' # Obligatorio para evitar error de versión
          distribution: 'temurin'

      - name: Sincronización Capacitor
        run: |
          npm install @capacitor/cli@latest @capacitor/core@latest @capacitor/android@latest
          # Forzamos la creación de la carpeta nativa limpia
          npx cap add android
          npx cap sync android

      - name: Generar APK de RutaCom
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -x test -x lint --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RutaCom-App-Real
          path: android/app/build/outputs/apk/debug/*.apk
          
