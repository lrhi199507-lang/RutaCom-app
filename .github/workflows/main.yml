name: Build APK Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Limpieza y Construccion Real
        run: |
          # 1. Eliminar CUALQUIER protocolo de Replit (catalog, workspace, etc)
          # Esto convierte "workspace:*" o "catalog:*" en "latest" para que GitHub pueda descargarlos
          sed -i 's/"workspace:[^"]*"/"latest"/g' package.json
          sed -i 's/"catalog:[^"]*"/"latest"/g' package.json
          rm -f package-lock.json
          
          # 2. Instalacion limpia
          npm install --force
          
          # 3. Intentar el Build de TU App Real
          # Si falla, el script se detendra para decirnos POR QUE fallo tu app real
          npm run build
          
          # 4. Configurar Android con el codigo de tu app
          npx cap add android || true
          
          # Corregir configuraciones de Gradle para compatibilidad con Java 21
          sed -i '/android {/a \    namespace "com.rutacom.app"\n    compileOptions { sourceCompatibility JavaVersion.VERSION_21; targetCompatibility JavaVersion.VERSION_21 }\n    kotlinOptions { jvmTarget = "21" }\n    lintOptions { abortOnError false }' android/app/build.gradle
          
          npx cap sync android

      - name: Build APK (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -x test -x lint --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RutaCom-App-Real
          path: android/app/build/outputs/apk/**/*.apk
          
