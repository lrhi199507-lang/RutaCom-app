name: Build APK Final - App Real

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Limpieza y Construcción Real
        run: |
          # 1. Eliminar CUALQUIER rastro de protocolos de Replit (catalog, workspace)
          # Esto evita el Error 404 de la captura 160862.jpg
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const limpiar = (deps) => {
              if (!deps) return;
              Object.keys(deps).forEach(key => {
                if (key.includes("workspace") || String(deps[key]).includes("workspace") || String(deps[key]).includes("catalog")) {
                  delete deps[key];
                }
              });
            };
            limpiar(pkg.dependencies);
            limpiar(pkg.devDependencies);
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '

          # 2. Instalación limpia de dependencias
          npm install --force

          # 3. Inyectar plugins que faltan (Error 160872.jpg)
          # Esto asegura que Vite entienda tu código de React y Tailwind
          npm install @vitejs/plugin-react @tailwindcss/vite tailwindcss vite --save-dev

          # 4. COMPILAR TU APP (Sin rutas de escape)
          # Si este paso falla, GitHub nos dirá el error exacto en tu código JS/TS
          npm run build

          # 5. Configurar Android
          npx cap add android || true
          sed -i '/android {/a \    namespace "com.rutacom.app"\n    compileOptions { sourceCompatibility JavaVersion.VERSION_21; targetCompatibility JavaVersion.VERSION_21 }\n    lintOptions { abortOnError false }' android/app/build.gradle
          npx cap sync android

      - name: Generar APK con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK de Tu App
        uses: actions/upload-artifact@v4
        with:
          name: RutaCom-App-Real
          path: android/app/build/outputs/apk/debug/*.apk
          
