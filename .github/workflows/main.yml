name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Force Build
        run: |
          # 1. Buscamos la carpeta donde subiste el build.gradle
          DIR=$(find . -name "build.gradle" -exec dirname {} \; | head -n 1)
          cd "$DIR"
          
          # 2. TRUCO: Generamos el wrapper que falta automáticamente
          gradle wrapper
          
          # 3. Construimos el APK
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RutaCom-debug-apk
          path: "**/*.apk"
          
