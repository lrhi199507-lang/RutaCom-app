name: Build APK Real - RutaCom

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Versión necesaria según el log

      - name: Limpiar y Construir Interfaz Real
        run: |
          # Eliminar bloqueos de Replit y corregir protocolos
          sed -i 's/catalog:/latest/g' package.json
          sed -i '/@workspace/d' package.json
          rm -f .npmrc package-lock.json
          
          # Instalación fresca
          npm install --force
          
          # COMPILACIÓN DE TU CÓDIGO SRC
          # Si este paso falla, es porque hay errores en tu código de React
          npx vite build 

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21' # Necesario para evitar error de versión
          distribution: 'temurin'

      - name: Sincronizar con Android
        run: |
          npm install @capacitor/cli@latest @capacitor/android@latest
          npx cap add android || true
          # Forzamos que Capacitor use la carpeta dist recién creada
          npx cap copy android
          npx cap sync android

      - name: Generar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -x test -x lint --no-daemon

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: RutaCom-Produccion
          path: android/app/build/outputs/apk/debug/*.apk
          
