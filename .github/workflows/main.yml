name: Build APK - RutaCom Estilo Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalación de Motor de Diseño y App
        run: |
          # 1. Limpieza total
          sed -i 's/catalog:/latest/g' package.json
          sed -i '/@workspace/d' package.json
          rm -f .npmrc package-lock.json
          rm -rf android
          
          # 2. INSTALACIÓN DE ESTILOS (Tailwind + PostCSS)
          # Esto es lo que falta para que no se vea solo texto blanco
          npm install --force
          npm install -D tailwindcss postcss autoprefixer lucide-react firebase
          npm install -D typescript ts-node vite @vitejs/plugin-react
          
          # 3. Asegurar que Tailwind esté inicializado
          npx tailwindcss init -p || true

          # 4. Crear el index.html limpio
          echo '<!DOCTYPE html>
          <html lang="es">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
              <title>RutaCom</title>
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/src/main.tsx"></script>
            </body>
          </html>' > index.html

          # 5. COMPILAR (Aquí se genera el diseño real)
          npx vite build --outDir dist

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Capacitor Sync
        run: |
          npm install @capacitor/cli@latest @capacitor/core@latest @capacitor/android@latest
          echo "import { CapacitorConfig } from '@capacitor/cli'; const config: CapacitorConfig = { appId: 'com.rutacom.app', appName: 'RutaCom', webDir: 'dist', server: { androidScheme: 'https' } }; export default config;" > capacitor.config.ts
          npx cap add android || true
          npx cap sync android

      - name: Generar APK con Diseño
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RutaCom-App-Diseno-Real
          path: android/app/build/outputs/apk/debug/*.apk
          
