name: Build APK - Limpieza Profunda

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Limpieza Quirurgica de Replit
        run: |
          # 1. BORRAR ARCHIVOS DE CONFIGURACIÓN DE REPLIT (Culpables del 404)
          rm -f .npmrc
          rm -f package-lock.json
          
          # 2. Limpiar el package.json de cualquier rastro de @workspace
          sed -i '/@workspace/d' package.json
          sed -i 's/"catalog:[^"]*"/"latest"/g' package.json
          
          # 3. INSTALACIÓN DESDE CERO (Sin usar el lock viejo)
          npm install --no-package-lock
          
          # 4. Asegurar que Vite esté presente para el build
          npm install vite @vitejs/plugin-react --save-dev
          
          # 5. COMPILAR LA APP REAL
          npx vite build
          
          # Verificación: Si no hay carpeta dist, algo salió mal en tu código src
          if [ ! -d "dist" ]; then echo "Error: No se generó la carpeta dist"; exit 1; fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Capacitor Sync
        run: |
          npm install @capacitor/cli @capacitor/core @capacitor/android
          echo '{"appId":"com.rutacom.app","appName":"RutaCom","webDir":"dist"}' > capacitor.config.json
          npx cap add android || true
          npx cap sync android

      - name: Build APK Final
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: RutaCom-App-Real
          path: android/app/build/outputs/apk/debug/*.apk
          
