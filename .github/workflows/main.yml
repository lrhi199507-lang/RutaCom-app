name: Build APK Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Limpieza y Construccion Real
        run: |
          # 1. Script para ELIMINAR dependencias rotas de Replit (@workspace y catalog)
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const limpiar = (deps) => {
              if (!deps) return;
              Object.keys(deps).forEach(key => {
                if (key.includes("workspace") || String(deps[key]).includes("workspace") || String(deps[key]).includes("catalog")) {
                  console.log("Eliminando paquete incompatible: " + key);
                  delete deps[key];
                }
              });
            };
            limpiar(pkg.dependencies);
            limpiar(pkg.devDependencies);
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '

          # 2. Instalacion limpia ignorando conflictos de versiones (Peer Deps)
          npm install --force --legacy-peer-deps

          # 3. Instalacion de emergencia de Tailwind y Vite para evitar el error @theme
          npm install tailwindcss @tailwindcss/vite vite @vitejs/plugin-react --no-save

          # 4. Intentar construir TU aplicacion real
          npm run build

          # 5. Configurar Android con tu codigo real
          npx cap add android || true
          sed -i '/android {/a \    namespace "com.rutacom.app"\n    compileOptions { sourceCompatibility JavaVersion.VERSION_21; targetCompatibility JavaVersion.VERSION_21 }\n    lintOptions { abortOnError false }' android/app/build.gradle
          npx cap sync android

      - name: Build APK (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -x test -x lint --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RutaCom-App-Real
          path: android/app/build/outputs/apk/**/*.apk
          
