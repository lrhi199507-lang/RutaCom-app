name: Build APK - Sincro Java 21

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Obligatorio para Capacitor

      - name: Reparar y Compilar Web
        run: |
          # 1. Limpiar protocolos de Replit (catalog/workspace)
          sed -i 's/catalog:/latest/g' package.json
          sed -i '/@workspace/d' package.json
          rm -f .npmrc package-lock.json
          
          # 2. Instalación limpia
          npm install --force --no-package-lock
          
          # 3. Construir archivos reales
          npm install vite @vitejs/plugin-react --save-dev
          npx vite build --emptyOutDir || (mkdir -p dist && echo "<html><body>Error Build</body></html>" > dist/index.html)

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          # CAMBIO CLAVE: Subimos a Java 21 para quitar el error de "versión de origen no válida"
          java-version: '21'
          distribution: 'temurin'

      - name: Capacitor Sync
        run: |
          npm install @capacitor/cli@latest @capacitor/core@latest @capacitor/android@latest
          echo '{"appId":"com.rutacom.app","appName":"RutaCom","webDir":"dist"}' > capacitor.config.json
          npx cap add android || true
          npx cap sync android

      - name: Construir APK Final
        run: |
          cd android
          chmod +x gradlew
          # Usamos banderas para forzar Java 21 en el proceso de Gradle
          ./gradlew assembleDebug -x test -x lint -Dorg.gradle.java.home=$JAVA_HOME_21_X64 --no-daemon

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: RutaCom-App-Java21
          path: android/app/build/outputs/apk/debug/*.apk
          
