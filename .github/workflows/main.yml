name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps --no-package-lock || true
          # Forzamos la creación de la carpeta android si algo falla
          npx cap add android || true
          npx cap sync android

      - name: Force Repair and Build
        run: |
          ANDROID_DIR=$(find . -name "build.gradle" -not -path "*/node_modules/*" -exec dirname {} \; | head -n 1)
          
          # Reparamos el archivo build.gradle principal que da error
          cat <<EOF > "$ANDROID_DIR/build.gradle"
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.1' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          # Reparamos el del la App
          cat <<EOF > "$ANDROID_DIR/app/build.gradle"
          apply plugin: 'com.android.application'
          android {
              namespace "com.rutacom.app"
              compileSdk 34
              defaultConfig {
                  applicationId "com.rutacom.app"
                  minSdk 22
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          cd "$ANDROID_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RutaCom-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
            **/*.apk
            
