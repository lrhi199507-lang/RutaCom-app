name: Build APK Final - App Real

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Limpiar y Preparar Proyecto
        run: |
          # 1. Eliminar dependencias de Replit (Error 404 en 160862.jpg)
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const removerBasura = (obj) => {
              if (!obj) return;
              for (const key in obj) {
                if (key.includes("workspace") || String(obj[key]).includes("workspace") || String(obj[key]).includes("catalog")) {
                  delete obj[key];
                }
              }
            };
            removerBasura(pkg.dependencies);
            removerBasura(pkg.devDependencies);
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '

          # 2. Instalación base
          npm install --force

          # 3. INSTALAR PLUGINS FALTANTES (Corrigiendo errores 160872.jpg y 160738.jpg)
          npm install @vitejs/plugin-react @tailwindcss/vite tailwindcss vite --save-dev

          # 4. COMPILAR LA APP REAL
          # Si este paso falla, detendrá el proceso y nos dirá el error en tu código JS
          npm run build

          # 5. Sincronizar con Capacitor (Android)
          npx cap add android || true
          # Asegurar que Android use Java 21
          sed -i '/android {/a \    namespace "com.rutacom.app"\n    compileOptions { sourceCompatibility JavaVersion.VERSION_21; targetCompatibility JavaVersion.VERSION_21 }\n    lintOptions { abortOnError false }' android/app/build.gradle
          npx cap sync android

      - name: Build APK (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Real
        uses: actions/upload-artifact@v4
        with:
          name: RutaCom-App-Final
          path: android/app/build/outputs/apk/debug/*.apk
          
