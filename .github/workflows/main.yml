name: Build AAB Produccion - Dame la cola

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalación Forzada de Diseño
        run: |
          # 1. Limpieza de archivos de configuración viejos
          sed -i 's/catalog:/latest/g' package.json
          sed -i '/@workspace/d' package.json
          rm -f .npmrc package-lock.json
          
          # 2. Instalación usando --legacy-peer-deps para evitar el error ERESOLVE
          npm install --force --legacy-peer-deps
          npm install -D tailwindcss @tailwindcss/vite postcss autoprefixer vite @vitejs/plugin-react typescript ts-node --legacy-peer-deps
          
          # 🔥 AQUÍ ESTÁ LA SOLUCIÓN: Agregamos los plugins de geolocalización a React antes de compilar
          npm install firebase lucide-react clsx tailwind-merge class-variance-authority @radix-ui/react-slot react-leaflet leaflet @capacitor/geolocation --legacy-peer-deps
          
          # 3. Asegurar el index.html
          echo '<!DOCTYPE html>
          <html lang="es">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
              <title>Dame la cola</title>
              <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/src/main.tsx"></script>
            </body>
          </html>' > index.html

          # 4. COMPILAR (Ahora sí pasará porque las librerías ya existen)
          npx vite build --outDir dist
          

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Sincronización Capacitor
        run: |
          # 1. Instalamos Capacitor, GPS, Background Geolocation y Generador de Assets
          npm install @capacitor/cli@latest @capacitor/core@latest @capacitor/android@latest @capacitor/push-notifications@latest @capacitor/geolocation@latest @capacitor/assets@latest --legacy-peer-deps
          
          # 2. Creamos el archivo de configuración
          echo "import { CapacitorConfig } from '@capacitor/cli'; const config: CapacitorConfig = { appId: 'com.damelacola.app', appName: 'Dame la cola', webDir: 'dist', server: { androidScheme: 'https' } }; export default config;" > capacitor.config.ts
          
          # 3. Agregamos la plataforma Android
          npx cap add android || true
          
          # 4. Copiamos el archivo de Firebase
          cp google-services.json android/app/
          
          # 5. Inyectamos Firebase en los archivos Gradle
          sed -i '/dependencies {/a \        classpath "com.google.gms:google-services:4.4.1"' android/build.gradle
          echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
          
          # 6. Sincronizamos
          npx cap sync android
          # 🔥 INYECCIÓN DE VERSIÓN (SE DEBE HACER AQUÍ)
          VERSION_NAME=$(node -p "require('./package.json').version")
          sed -i "s/versionName \".*\"/versionName \"${VERSION_NAME}\"/" android/app/build.gradle
          sed -i 's/versionCode [0-9]*/versionCode 10/' android/app/build.gradle
          
          echo "Actualizada versión a ${VERSION_NAME} (code 10)"
          

          # 7. INYECTAR PERMISOS (NOTIFICACIONES, GPS Y SEGUNDO PLANO)
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="true" />' android/app/src/main/AndroidManifest.xml

          # 8. MAGIA DEL ÍCONO PROFESIONAL
          mkdir -p assets
          cp icon.png assets/icon.png || echo "CRÍTICO: No se encontró el archivo icon.png en la raíz"
          npx @capacitor/assets generate --android
          
          
      - name: Decodificar Keystore de Producción
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/rutacom.jks

      - name: Construir Android App Bundle (AAB) Oficial
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Firmar el AAB
        run: jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore android/app/rutacom.jks -storepass "${{ secrets.KEYSTORE_PASSWORD }}" android/app/build/outputs/bundle/release/app-release.aab "${{ secrets.KEYSTORE_ALIAS }}"

      - name: Subir AAB Firmado (Para la Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: DameLaCola-Release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
