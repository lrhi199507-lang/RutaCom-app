name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK (Auto-detect folder)
        run: |
          # Este comando busca el archivo gradlew en cualquier carpeta
          GRADLEW_FILE=$(find . -name "gradlew" | head -n 1)
          if [ -z "$GRADLEW_FILE" ]; then
            echo "Error: No se encontró el archivo gradlew en ninguna carpeta."
            exit 1
          fi
          
          # Entrar a la carpeta donde está el archivo y darle permisos
          DIR=$(dirname "$GRADLEW_FILE")
          cd "$DIR"
          chmod +x gradlew
          
          # Empezar la construcción
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RutaCom-debug-apk
          path: "**/*.apk"
          
