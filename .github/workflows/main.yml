name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        run: |
          # Entramos a la carpeta exacta que vimos en tu Replit
          cd artifacts/rutacom/android/
          
          # Damos permiso al motor real
          chmod +x gradlew
          
          # Ejecutamos la construcción
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RutaCom-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          
