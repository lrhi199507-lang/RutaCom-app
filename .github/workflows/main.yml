name: Build APK - RutaCom Pro Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalación de Componentes y Diseño
        run: |
          # 1. Limpieza de entorno
          sed -i 's/catalog:/latest/g' package.json
          sed -i '/@workspace/d' package.json
          rm -f .npmrc package-lock.json
          rm -rf android
          
          # 2. Instalación de todas las librerías detectadas en tus archivos
          npm install --force
          npm install -D tailwindcss @tailwindcss/vite postcss autoprefixer typescript ts-node vite @vitejs/plugin-react
          npm install firebase lucide-react clsx tailwind-merge class-variance-authority @radix-ui/react-slot
          
          # 3. Crear el index.html (Asegurando que esté en la raíz)
          echo '<!DOCTYPE html>
          <html lang="es">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
              <title>RutaCom</title>
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/src/main.tsx"></script>
            </body>
          </html>' > index.html

          # 4. COMPILAR (Vite procesará el index.css y las clases de App.tsx)
          npx vite build --outDir dist

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Sincronización Capacitor
        run: |
          npm install @capacitor/cli@latest @capacitor/core@latest @capacitor/android@latest
          echo "import { CapacitorConfig } from '@capacitor/cli'; const config: CapacitorConfig = { appId: 'com.rutacom.app', appName: 'RutaCom', webDir: 'dist', server: { androidScheme: 'https' } }; export default config;" > capacitor.config.ts
          npx cap add android || true
          npx cap sync android

      - name: Generar APK Final
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RutaCom-App-Pro-Final
          path: android/app/build/outputs/apk/debug/*.apk
          
