name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          # Eliminamos el cache de gradle temporalmente para evitar errores de ruta
          
      - name: Find and Grant execute permission for gradlew
        run: |
          GRADLEW_PATH=$(find . -name gradlew)
          chmod +x $GRADLEW_PATH
          echo "GRADLEW_DIR=$(dirname $GRADLEW_PATH)" >> $GITHUB_ENV

      - name: Build with Gradle
        run: |
          cd ${{ env.GRADLEW_DIR }}
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RutaCom-debug-apk
          path: "**/*.apk"
          
