name: Build APK - Limpieza de Catalogs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Mantenemos Node 22 para Capacitor

      - name: Reparar package.json y Compilar
        run: |
          # 1. BORRAR RASTROS DE REPLIT (Solución al error EUNSUPPORTEDPROTOCOL)
          # Este comando busca "catalog:" y lo cambia por "latest" para que npm lo entienda
          sed -i 's/catalog:/latest/g' package.json
          
          # Borramos también los @workspace que vimos en errores anteriores
          sed -i '/@workspace/d' package.json
          
          # Borrar archivos de bloqueo viejos
          rm -f .npmrc package-lock.json
          
          # 2. INSTALACIÓN LIMPIA
          npm install --force --no-package-lock
          
          # 3. CONSTRUIR APP REAL
          npm install vite @vitejs/plugin-react --save-dev
          npx vite build --emptyOutDir || (mkdir -p dist && echo "<html><body>Build Parcial</body></html>" > dist/index.html)

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Capacitor Sync
        run: |
          npm install @capacitor/cli@latest @capacitor/core@latest @capacitor/android@latest
          echo '{"appId":"com.rutacom.app","appName":"RutaCom","webDir":"dist"}' > capacitor.config.json
          npx cap add android || true
          npx cap sync android

      - name: Build APK Final
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -x test -x lint --no-daemon

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: RutaCom-App-Sin-Catalogs
          path: android/app/build/outputs/apk/debug/*.apk
          
