name: Build APK - RutaCom v4 Design

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compilación de Motor de Diseño Avanzado
        run: |
          # Limpiar rastros
          sed -i 's/catalog:/latest/g' package.json
          sed -i '/@workspace/d' package.json
          rm -f .npmrc package-lock.json
          rm -rf android
          
          # Instalación de librerías para Tailwind Moderno y UI
          npm install --force
          npm install -D tailwindcss @tailwindcss/vite @tailwindcss/typography postcss autoprefixer
          npm install lucide-react firebase clsx tailwind-merge class-variance-authority
          
          # Crear el index.html que conecte con tu main.tsx
          echo '<!DOCTYPE html>
          <html lang="es">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
              <title>RutaCom</title>
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/src/main.tsx"></script>
            </body>
          </html>' > index.html

          # COMPILAR (Aquí es donde se aplica toda la magia de tu index.css)
          npx vite build --outDir dist

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Capacitor Sync
        run: |
          npm install @capacitor/cli@latest @capacitor/core@latest @capacitor/android@latest
          echo "import { CapacitorConfig } from '@capacitor/cli'; const config: CapacitorConfig = { appId: 'com.rutacom.app', appName: 'RutaCom', webDir: 'dist', server: { androidScheme: 'https' } }; export default config;" > capacitor.config.ts
          npx cap add android || true
          npx cap sync android

      - name: Generar APK Final
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RutaCom-Pro-APK
          path: android/app/build/outputs/apk/debug/*.apk
          
