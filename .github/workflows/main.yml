name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Force Build APK
        run: |
          # 1. Buscar el archivo gradlew en cualquier carpeta
          GRADLEW_FILE=$(find . -name "gradlew" | head -n 1)
          
          if [ -z "$GRADLEW_FILE" ]; then
            echo "ERROR: No se encontró el archivo gradlew. Asegúrate de haber subido la carpeta del proyecto."
            exit 1
          fi
          
          # 2. Dar permisos y entrar a la carpeta correcta
          chmod +x "$GRADLEW_FILE"
          cd "$(dirname "$GRADLEW_FILE")"
          
          # 3. Ejecutar la construcción
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RutaCom-debug-apk
          path: "**/*.apk"
          
