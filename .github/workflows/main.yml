name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare Project and Fix JSON
        run: |
          rm -rf android
          rm -rf node_modules
          
          # Reparación segura de JSON
          node -e '
          const fs = require("fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const clean = (obj) => {
            if (!obj) return;
            for (const key in obj) {
              if (obj[key].includes("workspace:") || obj[key].includes("catalog:")) {
                delete obj[key];
              }
            }
          };
          clean(pkg.dependencies);
          clean(pkg.devDependencies);
          fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '
          
          npm install --no-package-lock --force --ignore-scripts
          mkdir -p dist
          echo "<html><body>RutaCom</body></html>" > dist/index.html
          
          # Generar carpeta Android limpia
          npx cap add android
          
          # Configurar el Namespace de forma que no rompa el archivo
          # Simplemente añadimos la línea al principio sin borrar nada más
          echo "namespace = 'com.rutacom.app'" > android/app/build.gradle.tmp
          cat android/app/build.gradle >> android/app/build.gradle.tmp
          mv android/app/build.gradle.tmp android/app/build.gradle
          
          # Crear google-services mínimo para que no de error
          echo "{\"project_info\":{\"project_number\":\"123\",\"project_id\":\"rutacom-app\"},\"client\":[{\"client_info\":{\"mobilesdk_app_id\":\"1:0:android:0\",\"android_client_info\":{\"package_name\":\"com.rutacom.app\"}},\"api_key\":[{\"current_key\":\"0\"}]}]}" > android/app/google-services.json
          
          npx cap sync android

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          # Quitamos --info para que el log sea más limpio y fácil de leer
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RutaCom-App-Debug
          path: android/app/build/outputs/apk/debug/*.apk
          
