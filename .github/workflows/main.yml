name: Build APK Final - RutaCom

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22' #

      - name: Limpieza y Construcción Web
        run: |
          # 1. Corregir archivos de Replit
          sed -i 's/catalog:/latest/g' package.json
          sed -i '/@workspace/d' package.json
          rm -f .npmrc package-lock.json
          
          # 2. Borrar archivos de Android mal ubicados
          rm -rf android gradlew gradlew.bat build.gradle settings.gradle capacitor.build.gradle capacitor.settings.gradle
          
          # 3. INSTALACIÓN CRÍTICA (Añadimos typescript y ts-node)
          npm install --force
          npm install -D typescript ts-node vite @vitejs/plugin-react
          
          # 4. Generar la carpeta dist con tu código real
          npx vite build 

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21' #
          distribution: 'temurin'

      - name: Sincronización Capacitor
        run: |
          # Instalamos Capacitor y sus dependencias
          npm install @capacitor/cli@latest @capacitor/core@latest @capacitor/android@latest
          
          # Ahora que TypeScript está instalado, npx cap podrá leer el .ts
          npx cap add android || true
          npx cap sync android

      - name: Generar APK de RutaCom
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -x test -x lint --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RutaCom-App-Real
          path: android/app/build/outputs/apk/debug/*.apk
          
