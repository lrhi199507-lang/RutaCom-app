name: Build APK Final - App Real

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Limpiar y Compilar App Real
        run: |
          # 1. Borrar paquetes de Replit que causan el Error 404 (Captura 160862)
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const eliminarIncompatibles = (deps) => {
              if (!deps) return;
              Object.keys(deps).forEach(key => {
                if (key.includes("workspace") || String(deps[key]).includes("workspace") || String(deps[key]).includes("catalog")) {
                  console.log("Eliminando paquete fantasma: " + key);
                  delete deps[key];
                }
              });
            };
            eliminarIncompatibles(pkg.dependencies);
            eliminarIncompatibles(pkg.devDependencies);
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '

          # 2. Instalación forzada
          npm install --force

          # 3. Solución para el error de Tailwind @theme (Captura 160738)
          # Instalamos los plugins necesarios para que Vite entienda tu CSS real
          npm install @tailwindcss/vite tailwindcss vite --no-save

          # 4. COMPILAR TU APP (Sin rutas de escape)
          # Si esto falla, el proceso se detendrá y nos dirá el error exacto en TU código
          npm run build

          # 5. Sincronizar con Android
          npx cap add android || true
          # Asegurar compatibilidad de Java en el proyecto Android
          sed -i '/android {/a \    namespace "com.rutacom.app"\n    compileOptions { sourceCompatibility JavaVersion.VERSION_21; targetCompatibility JavaVersion.VERSION_21 }\n    lintOptions { abortOnError false }' android/app/build.gradle
          npx cap sync android

      - name: Generar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RutaCom-App-Real
          path: android/app/build/outputs/apk/debug/*.apk
          
