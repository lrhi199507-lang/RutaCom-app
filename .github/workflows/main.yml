name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare Project
        run: |
          # 1. Limpieza profunda
          rm -rf android
          rm -f package-lock.json
          
          # 2. Instalación de dependencias
          npm install --legacy-peer-deps --no-package-lock || true
          
          # 3. Reconstrucción de la carpeta Android desde cero
          npx cap add android
          npx cap sync android

      - name: Fix and Build
        run: |
          # 1. Localizamos la nueva carpeta
          cd android
          
          # 2. Inyectamos la configuración de SDK corregida
          sed -i 's/compileSdkVersion.*/compileSdk = 34/' app/build.gradle
          sed -i 's/targetSdkVersion.*/targetSdk = 34/' app/build.gradle
          
          # 3. Permisos y construcción
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RutaCom-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          
