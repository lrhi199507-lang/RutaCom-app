name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare Project
        run: |
          rm -rf android
          
          # REPARACIÓN SEGURA DE JSON (Solución a 160227.jpg y 160228.jpg)
          node -e '
          const fs = require("fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const clean = (obj) => {
            if (!obj) return;
            for (const key in obj) {
              if (obj[key].includes("workspace:") || obj[key].includes("catalog:")) {
                delete obj[key];
              }
            }
          };
          clean(pkg.dependencies);
          clean(pkg.devDependencies);
          fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '
          
          # Instalación limpia
          npm install --no-package-lock --force --ignore-scripts
          
          mkdir -p dist
          echo "<html><body>RutaCom</body></html>" > dist/index.html
          
          npx cap add android
          npx cap sync android

      - name: Final Android Fix
        run: |
          mkdir -p android/app
          echo '{"project_info":{"project_number":"0","project_id":"temp"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"com.rutacom.app"}},"api_key":[{"current_key":"0"}]}]}' > android/app/google-services.json
          
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          
          # Parche de Namespace para Capacitor 6+ (Solución a 160214.jpg)
          sed -i "/android {/a \    namespace \"com.rutacom.app\"" android/app/build.gradle || true

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -x lint

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RutaCom-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          
