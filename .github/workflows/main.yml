name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps --no-package-lock || true
          npx cap sync android

      - name: Force Build
        run: |
          # 1. Buscamos la carpeta de Android
          ANDROID_DIR=$(find . -name "build.gradle" -not -path "*/node_modules/*" -exec dirname {} \; | head -n 1)
          
          # 2. Aseguramos que los archivos de Capacitor estén en su sitio
          find . -name "capacitor.*.gradle" -exec cp {} "$ANDROID_DIR/" \;
          
          cd "$ANDROID_DIR"
          
          # 3. LA CLAVE: Forzamos el permiso de ejecución al máximo
          chmod +x gradlew
          
          # 4. Generamos el wrapper y construimos
          ./gradlew wrapper
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RutaCom-debug-apk
          path: "**/*.apk"
          
