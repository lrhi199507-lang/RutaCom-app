name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare Project
        run: |
          rm -rf android
          npm install --legacy-peer-deps --no-package-lock || true
          mkdir -p dist
          cp -r * dist/ 2>/dev/null || true
          npx cap add android
          npx cap sync android

      - name: Final Android Fix
        run: |
          cd android/app
          # Actualizamos el archivo para que sea compatible con Android 14
          echo "android.namespace = 'com.rutacom.app'" >> ../gradle.properties
          sed -i 's/compileSdkVersion.*/compileSdk = 34/' build.gradle || true
          sed -i 's/targetSdkVersion.*/targetSdk = 34/' build.gradle || true
          
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RutaCom-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          
